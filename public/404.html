<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jimmy Libot — Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App redirect script
      // When a direct URL like /personal-portfolio/projects/ai-video is loaded,
      // GitHub Pages serves this 404.html, which redirects back to the index with a hash.
      var pathSegmentsToKeep = 1; // 1 for project repository root: /personal-portfolio/
      var l = window.location;
      
      // If we are hosted at root (custom domain), pathSegmentsToKeep is 0
      if (!l.pathname.startsWith('/personal-portfolio')) {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
